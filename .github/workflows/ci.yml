name: CI

# Roda a cada Pull Request, a cada push na main e sob demanda.
# O PR só deve ser integrado com este check verde.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Princípio do menor privilégio: o CI só precisa ler o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pratocheio
          POSTGRES_PASSWORD: pratocheio
          POSTGRES_DB: pratocheio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pratocheio"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgres://pratocheio:pratocheio@localhost:5432/pratocheio
      # O banco do CI é descartável: os testes podem usar o mesmo.
      TEST_DATABASE_URL: postgres://pratocheio:pratocheio@localhost:5432/pratocheio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes com cobertura mínima
        run: npm run ci

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Resumo da cobertura no PR
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total;
              const linhas = ['lines', 'statements', 'functions', 'branches'].map((k) => '| ' + k + ' | ' + t[k].pct + '% |');
              console.log(['## Cobertura de testes', '', '| Métrica | % |', '|---|---|', ...linhas].join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verificar que a migração é idempotente
        run: |
          npm run db:migrar
          npm run db:migrar

      - name: Verificar se a aplicação sobe
        run: |
          npm start > server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for tentativa in {1..15}; do
            if curl --fail --silent http://localhost:3001/api/saude; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

  auditoria-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informativo: não bloqueia o PR, mas deixa vulnerabilidades visíveis.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
