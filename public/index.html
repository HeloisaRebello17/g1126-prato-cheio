<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prato Cheio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 2rem 1rem;
      background: #f4f7f4;
      color: #26332a;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }


    .cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #dce8de;
    }

    .cabecalho h1 {
      margin: 0;
      color: #2e7d32;
      font-size: 2rem;
    }

    .seletor-usuario {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .seletor-usuario label {
      margin: 0;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .seletor-usuario select {
      width: auto;
      min-width: 120px;
    }

    fieldset {
      border: none;
      border-radius: 12px;
      margin: 0;
      padding: 1.5rem;
      background: #ffffff;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    legend {
      padding: 0 0.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2e7d32;
    }

    label {
      display: block;
      margin: 1rem 0 0.4rem;
      font-size: 0.9rem;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
    }

    input,
    select {
      border: 1px solid #cbd5cc;
      background: #ffffff;
      color: #26332a;
    }

    input::placeholder {
      color: #9aa49c;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #43a047;
      box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.15);
    }

    button {
      margin-top: 1rem;
      border: none;
      background: #43a047;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #2e7d32;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }


    #doacoesDisponiveis {
      display: none;
    }

    #doacoesDisponiveis h2 {
      margin: 0 0 1rem;
      color: #2e7d32;
      font-size: 1.4rem;
    }

    ul {
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;

      padding: 1rem;
      margin-bottom: 0.8rem;

      list-style: none;
      border-radius: 10px;
      background: #ffffff;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
    }

    li button {
      width: auto;
      min-width: 100px;
      margin: 0;
      padding: 0.6rem 1rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .cabecalho {
        flex-direction: column;
        align-items: stretch;
      }

      .cabecalho h1 {
        text-align: center;
        font-size: 1.8rem;
      }

      .seletor-usuario {
        justify-content: space-between;
      }

      .seletor-usuario select {
        min-width: 130px;
      }

      fieldset {
        padding: 1.2rem;
      }

      li {
        flex-direction: column;
        align-items: stretch;
      }

      li button {
        width: 100%;
      }
    }
  </style>

</head>

<body>
  <div class="container">

    <header class="cabecalho">
      <h1>Prato Cheio</h1>

      <div class="seletor-usuario">
        <label for="tipoUsuario">Usuário:</label>

        <select id="tipoUsuario" name="tipoUsuario">
          <option value="doador">Doador</option>
          <option value="ong">ONG</option>
        </select>
      </div>
    </header>


    <div id="areaDoador">

      <fieldset>
        <legend>Publicar doação</legend>

        <label for="tipoAlimento">
          Tipo de alimento
        </label>

        <input id="tipoAlimento" type="text" placeholder="Ex.: sopa, pão, frutas" />

        <label for="quantidade">
          Quantidade
        </label>

        <input id="quantidade" type="text" placeholder="Ex.: 10 porções" />

        <label for="validade">
          Validade / retirar até
        </label>

        <input
          id="validade"
          type="text"
          inputmode="numeric"
          maxlength="10"
          placeholder="dd/mm/aaaa"
          aria-describedby="validade-erro"
        />
        <small id="validade-erro" style="color: #b00020; display: block; min-height: 1.2em;"></small>

        <button id="publicar">
          Publicar doação
        </button>

      </fieldset>

    </div>

    <div id="doacoesDisponiveis">

      <h2>Doações disponíveis</h2>

      <ul id="lista"></ul>

    </div>

    <p id="mensagemErro" role="alert"></p>
  </div>

  <script>
    const tipoUsuario = document.getElementById("tipoUsuario");
    const areaDoador = document.getElementById("areaDoador");
    const doacoesDisponiveis = document.getElementById(
      "doacoesDisponiveis"
    );

    function mostrarErro(mensagem) {
      const elemento = document.getElementById("mensagemErro");
      elemento.textContent = mensagem;
      elemento.style.color = "red";
    }

    function atualizarTela() {
      if (tipoUsuario.value === "ong") {
        areaDoador.style.display = "none";
        doacoesDisponiveis.style.display = "block";

        carregar();
      } else {
        areaDoador.style.display = "block";
        doacoesDisponiveis.style.display = "none";
      }
    }

    tipoUsuario.addEventListener("change", atualizarTela);

    async function carregar() {
      try {
        const res = await fetch("/api/doacoes");

        const doacoes = await res.json();

        const lista = document.getElementById("lista");

        lista.innerHTML = doacoes.length
          ? ""
          : "<li>Nenhuma doação disponível.</li>";

        for (const d of doacoes) {

          const dataParaExibir = d.validade.includes("/")
            ? d.validade
            : (() => {
                const [ano, mes, dia] = d.validade.split("-");
                return `${dia}/${mes}/${ano}`;
              })();

          const li = document.createElement("li");

          li.textContent =
            `${d.tipo} — ${d.quantidade} (até ${dataParaExibir})`;

          const botao = document.createElement("button");

          botao.textContent = "Aceitar";

          botao.onclick = async () => {
            const res = await fetch(`/api/doacoes/${d.id}/aceitar`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                ong: "Minha ONG"
              })
            });

            const dados = await res.json();

            if (!res.ok) {
              mostrarErro(dados.erro);
              return;
            }

            document.getElementById("mensagemErro").textContent = "";
            carregar();
          };

          li.appendChild(botao);

          lista.appendChild(li);
        }

      } catch (erro) {

        console.error(
          "Erro ao carregar doações:",
          erro
        );

      }
    }

    function validarDataValidade(data) {
      if (!data) return "Informe a data de validade.";
      if (!/^\d{2}\/\d{2}\/\d{4}$/.test(data)) {
        return "Use o formato dd/mm/aaaa.";
      }

      const [dia, mes, ano] = data.split("/").map(Number);
      const dataValidade = new Date(ano, mes - 1, dia);
      const hoje = new Date();
      const inicioHoje = new Date(
        hoje.getFullYear(),
        hoje.getMonth(),
        hoje.getDate()
      );

      if (
        dataValidade.getFullYear() !== ano ||
        dataValidade.getMonth() !== mes - 1 ||
        dataValidade.getDate() !== dia ||
        dataValidade < inicioHoje
      ) {
        return "A validade não pode ser anterior à data de hoje.";
      }

      return "";
    }

    function formatarDataValidade(value) {
      const digitos = value.replace(/\D/g, "").slice(0, 8);

      if (digitos.length <= 2) return digitos;
      if (digitos.length <= 4) return `${digitos.slice(0, 2)}/${digitos.slice(2)}`;
      return `${digitos.slice(0, 2)}/${digitos.slice(2, 4)}/${digitos.slice(4)}`;
    }

    const campoValidade = document.getElementById("validade");
    const erroValidade = document.getElementById("validade-erro");

    campoValidade.addEventListener("input", () => {
      const formatado = formatarDataValidade(campoValidade.value);
      if (formatado !== campoValidade.value) {
        campoValidade.value = formatado;
      }

      const mensagem = validarDataValidade(campoValidade.value);
      erroValidade.textContent = mensagem === "Informe a data de validade." ? "" : mensagem;
      campoValidade.setCustomValidity(mensagem || "");
    });

    document.getElementById("publicar").onclick =
      async () => {

        const tipo = document.getElementById("tipoAlimento").value;
        const quantidade = document.getElementById("quantidade").value;
        const validade = document.getElementById("validade").value;
        const erroValidade = validarDataValidade(validade);

        if (!tipo || !quantidade || !validade) {
          alert("Tipo, quantidade e validade são obrigatórios.");
          return;
        }

        if (erroValidade) {
          alert(erroValidade);
          return;
        }

        try {
          const res = await fetch(
            "/api/doacoes",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                tipo,
                quantidade,
                validade
              })
            }
          );

          if (!res.ok) {
            const erro = await res.json().catch(() => ({}));
            throw new Error(erro.erro || "Erro ao publicar doação.");
          }

          document.getElementById("tipoAlimento").value = "";
          document.getElementById("quantidade").value = "";
          document.getElementById("validade").value = "";

        } catch (erro) {
          alert(erro.message);
          console.error("Erro ao publicar doação:", erro);
        }
      };

    atualizarTela();
  </script>

</body>

</html>
