<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro - Prato Cheio</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <main>
    <h1>Criar cadastro</h1>
    <form id="cadastroForm">
      <label for="nome">Nome</label><input id="nome" required />
      <label for="email">E-mail</label><input id="email" type="email" pattern="[^\s@]+@[^\s@]+\.com" required autocomplete="email" />
      <label for="senha">Senha</label><input id="senha" type="password" minlength="6" required autocomplete="new-password" />
      <label for="perfil">Perfil</label>
      <select id="perfil"><option value="doador">Doador</option><option value="ong">ONG</option></select>
      <button type="submit">Cadastrar</button>
    </form>
    <p id="mensagem" role="alert"></p>
    <a href="login.html">Já tenho cadastro</a>
  </main>
  <script>
    function mostrarMensagem(mensagem) {
      const texto = String(mensagem || '');
      document.getElementById('mensagem').textContent = texto
        ? texto.charAt(0).toLocaleUpperCase('pt-BR') + texto.slice(1)
        : '';
    }

    const formulario = document.getElementById('cadastroForm');
    const campos = formulario.querySelectorAll('input, select');
    campos.forEach((campo) => {
      campo.addEventListener('input', () => campo.setCustomValidity(''));
      campo.addEventListener('invalid', () => {
        if (campo.validity.valueMissing) campo.setCustomValidity('Preencha este campo.');
        else if (campo.validity.typeMismatch || campo.validity.patternMismatch) campo.setCustomValidity('Informe um e-mail com @ e final .com.');
        else if (campo.validity.tooShort) campo.setCustomValidity('A senha deve ter pelo menos 6 caracteres.');
      });
    });
    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      try {
        const resposta = await fetch('/api/cadastro', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          nome: document.getElementById('nome').value, email: document.getElementById('email').value,
          senha: document.getElementById('senha').value, perfil: document.getElementById('perfil').value
        }) });
        const dados = await resposta.json();
        if (!resposta.ok) { mostrarMensagem(dados.erro); return; }
        const login = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value
        }) });
        const sessao = await login.json();
        if (!login.ok) { mostrarMensagem(sessao.erro); return; }
        localStorage.setItem('token', sessao.token);
        window.location.href = 'index.html';
      } catch {
        mostrarMensagem('Não foi possível conectar ao servidor. Abra a aplicação em http://localhost:3001.');
      }
    });
  </script>
</body>
</html>
